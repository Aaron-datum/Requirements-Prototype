<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Datum — File Selection (PPTX export)</title>
  <link rel="stylesheet" href="_ds/ui-design-current-f2d33032-2526-4d9b-9a3c-5f6c38e4af29/colors_and_type.css">
  <style>
    html, body { margin: 0; padding: 0; font-family: 'DM Sans', system-ui, sans-serif; background: #c9c4bb; }
    *, *::before, *::after { box-sizing: border-box; }
    .slide { width: 1440px; height: 900px; background: var(--bg-page); overflow: hidden; position: relative; }
    .slide + .slide { margin-top: 24px; }
    #deck { width: 1440px; margin: 0 auto; padding: 24px 0; }
    .fs-frame { height: 100%; width: 100%; overflow: hidden; }
    ::-webkit-scrollbar { width: 0; height: 0; }
    input::placeholder { color: var(--fg-muted); }
  </style>
</head>
<body data-theme="white">
  <div id="deck"></div>

  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
  <script src="_ds/ui-design-current-f2d33032-2526-4d9b-9a3c-5f6c38e4af29/_ds_bundle.js"></script>

  <script type="text/babel" src="fs-data.jsx"></script>
  <script type="text/babel" src="fs-primitives.jsx"></script>
  <script type="text/babel" src="fs-filtersidebar.jsx"></script>
  <script type="text/babel" src="fs-table.jsx"></script>
  <script type="text/babel" src="fs-gallery.jsx"></script>
  <script type="text/babel" src="fs-detailspanel.jsx"></script>
  <script type="text/babel" src="fs-app.jsx"></script>

  <script type="text/babel">
    const PREAPPLIED = {
      program:       { values: ['Atlas EV'] },
      modelYear:     { values: ['MY24'] },
      releaseStatus: { values: ['Released'] },
    };

    // Each slide pre-selects a file so the details panel (and Search CTA) shows.
    function Slide({ density, defaultView, selectId }) {
      return (
        <div className="slide">
          <div className="fs-frame">
            <FileSelectionApp density={density} defaultView={defaultView} initialFilters={PREAPPLIED} initialSelectedId={selectId} />
          </div>
        </div>
      );
    }

    function Deck() {
      React.useEffect(() => {
        const tick = () => { if (window.lucide) lucide.createIcons(); };
        tick();
        const id = setInterval(tick, 350);
        return () => clearInterval(id);
      }, []);
      return (
        <React.Fragment>
          <Slide density="comfortable" defaultView="table" selectId="f01" />
          <Slide density="compact" defaultView="table" selectId="f01" />
          <Slide density="comfortable" defaultView="gallery" selectId="f01" />
        </React.Fragment>
      );
    }

    ReactDOM.createRoot(document.getElementById('deck')).render(<Deck />);
  </script>
</body>
</html>
